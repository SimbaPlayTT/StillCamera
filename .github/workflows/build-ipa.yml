name: Build unsigned Still iOS IPA

on:
  push:
    paths:
      - "outputs/FramedCameraIOSStarter/**"
      - ".github/workflows/build-ipa.yml"
  pull_request:
    paths:
      - "outputs/FramedCameraIOSStarter/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Archive and package unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: outputs/FramedCameraIOSStarter
      ARCHIVE_PATH: ${{ runner.temp }}/StillCamera.xcarchive
      IPA_PATH: ${{ github.workspace }}/outputs/FramedCameraIOSStarter/artifacts/StillCamera-unsigned.ipa

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Apple build tool versions
        run: |
          xcodebuild -version
          xcodegen version

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Archive for physical iOS devices
        working-directory: ${{ env.PROJECT_DIR }}
        run: >-
          xcodebuild
          -project StillCamera.xcodeproj
          -scheme StillCamera
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath '${{ env.ARCHIVE_PATH }}'
          archive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="${ARCHIVE_PATH}/Products/Applications/Still.app"
          IPA_ROOT="${RUNNER_TEMP}/still-ipa-root"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload" "$(dirname "$IPA_PATH")"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/Still.app"
          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$IPA_PATH" Payload
          test -s "$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StillCamera-unsigned-ipa
          path: outputs/FramedCameraIOSStarter/artifacts/StillCamera-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
